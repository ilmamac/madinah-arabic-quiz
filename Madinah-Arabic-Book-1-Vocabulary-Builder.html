<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madinah Arabic Book 1 Vocabulary Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f9fbff);color:#18243a}.app{max-width:760px;margin:auto;padding:20px}header{background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 28px #00000012}h1{margin:0 0 6px;font-size:30px}.subtitle{color:#65748b;margin:0}.badge{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:20px;background:#e8f0ff;color:#315fb8;font-weight:700}.card{background:#fff;border-radius:24px;padding:24px;margin-top:18px;box-shadow:0 8px 28px #00000012}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}.progress{height:10px;background:#e8edf5;border-radius:10px;margin:16px 0;overflow:hidden}.bar{height:100%;width:0;background:#4b72d8;transition:.25s}.direction{text-align:center;color:#65748b;font-size:14px;margin-bottom:12px}.question{font-size:32px;font-weight:800;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;direction:rtl}.question.english{direction:ltr;font-size:28px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}button{font:inherit}.option{border:2px solid #dce4f1;background:#fff;border-radius:16px;padding:16px;min-height:68px;cursor:pointer;font-size:19px;transition:.15s}.option:hover{transform:translateY(-1px);border-color:#4b72d8}.option.correct{background:#e8f8ed;border-color:#2e9d59}.option.wrong{background:#fff0f0;border-color:#d9534f}.option[disabled]{cursor:default}.feedback{text-align:center;min-height:28px;margin:14px 0;font-weight:700}.next{display:block;margin:0 auto;padding:13px 24px;border:0;border-radius:14px;background:#4b72d8;color:#fff;cursor:pointer;font-weight:700}.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:54px;font-weight:900;margin:12px}.restart{padding:13px 24px;border:0;border-radius:14px;background:#4b72d8;color:#fff;font-weight:700;cursor:pointer}.small{font-size:13px;color:#778398;margin-top:18px;text-align:center}@media(max-width:560px){.options{grid-template-columns:1fr}.app{padding:12px}h1{font-size:25px}.question{font-size:28px}}
</style></head><body><div class="app"><header><h1>Madinah Arabic Book 1 Vocabulary Builder</h1><p class="subtitle">Madinah Arabic Book 1 • Vocabulary Building</p><span class="badge">LEVEL 2 • LESSON 3</span></header><section class="card" id="quizCard"><div class="top"><span id="count">Question 1 of 10</span><span id="scoreText">Score: 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="direction" id="direction"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" disabled>Next Question →</button><p class="small">Lesson 3 vocabulary • Four-option multiple choice</p></section><section class="card result" id="resultCard" style="display:none"><h2>Level 2 Complete 🎉</h2><div class="score" id="finalScore"></div><p id="resultMessage"></p><button class="restart" onclick="startQuiz()">Try Again</button></section></div><script>
const words=[["Heavy","ثَقِيلٌ"],["Moon","قَمَرٌ"],["Light","خَفِيفٌ"],["Clean","نَظِيفٌ"],["Poor","فَقِيرٌ"],["Sweet","حُلْوٌ"],["Sick","مَرِيضٌ"],["Notebook","دَفْتَرٌ"],["Shop","دُكَّانٌ"],["Rich","غَنِيٌّ"],["Father","أَبٌ"],["Paper","وَرَقٌ"],["Apple","تُفَّاحٌ"],["Delicious","لَذِيذٌ"],["Doctor","طَبِيبٌ"],["Tall","طَوِيلٌ"],["Short","قَصِيرٌ"],["Brother","أَخٌ"],["Messenger","رَسُولٌ"],["The","الـ"],["Broken","مَكْسُورٌ"],["Open","مَفْتُوحٌ"],["Sitting","جَالِسٌ"],["Standing","وَاقِفٌ"],["New","جَدِيدٌ"],["Old","قَدِيمٌ"],["Water","مَاءٌ"],["Cold","بَارِدٌ"],["Near","قَرِيبٌ"],["Far","بَعِيدٌ"],["Hot","حَارٌّ"],["Small","صَغِيرٌ"],["Big","كَبِيرٌ"],["Dirty","وَسِخٌ"],["Beautiful","جَمِيلٌ"],["Bread","خُبْزٌ"],["Eye","عَيْنٌ"],["Face","وَجْهٌ"],["Friend","صَدِيقٌ"],["Qur'an","قُرْآنٌ"],["Prayer","صَلَاةٌ"],["Ka'bah","كَعْبَةٌ"],["Head","رَأْسٌ"],["Finger","إِصْبَعٌ"],["Soap","صَابُونٌ"],["Nail","ظُفْرٌ"],["Dawn","فَجْرٌ"],["Midday","ظُهْرٌ"],["Afternoon / time","عَصْرٌ"],["Sunset","مَغْرِبٌ"],["Evening","عِشَاءٌ"],["Garden / paradise","جَنَّةٌ"],["Lunch / dinner","غَدَاءٌ"],["Mouth","فَمٌ"],["Air","هَوَاءٌ"],["Hand","يَدٌ"],["Garment","ثَوْبٌ"],["Gold","ذَهَبٌ"],["A flower","زَهْرَةٌ"],["A fish","سَمَكٌ"],["A sun","شَمْسٌ"],["Chest","صَدْرٌ"],["Guest","ضَيْفٌ"],["Back","ظَهْرٌ"],["Meat","لَحْمٌ"]];let questions=[],index=0,score=0,answered=false;const TOTAL=10;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function startQuiz(){index=0;score=0;answered=false;questions=shuffle(words).slice(0,TOTAL);document.getElementById("quizCard").style.display="block";document.getElementById("resultCard").style.display="none";render()}function render(){answered=false;const[en,ar]=questions[index];document.getElementById("count").textContent=`Question ${index+1} of ${TOTAL}`;document.getElementById("scoreText").textContent=`Score: ${score}`;document.getElementById("bar").style.width=index/TOTAL*100+"%";const arabicMode=index%2===0,q=document.getElementById("question");q.className="question "+(arabicMode?"":"english");q.textContent=arabicMode?en:ar;document.getElementById("direction").textContent=arabicMode?"Choose the Arabic word:":"Choose the English meaning:";const correct=arabicMode?ar:en,pool=words.filter(x=>x[arabicMode?1:0]!==correct),others=shuffle(pool).slice(0,3).map(x=>arabicMode?x[1]:x[0]),opts=shuffle([correct,...others]),box=document.getElementById("options");box.innerHTML="";opts.forEach(opt=>{const b=document.createElement("button");b.className="option";b.textContent=opt;if(arabicMode)b.dir="rtl";b.onclick=()=>choose(b,opt,correct);box.appendChild(b)});document.getElementById("feedback").textContent="";document.getElementById("next").disabled=true;document.getElementById("next").textContent=index===TOTAL-1?"See Result →":"Next Question →"}function choose(button,selected,correct){if(answered)return;answered=true;document.querySelectorAll(".option").forEach(b=>b.disabled=true);if(selected===correct){score++;button.classList.add("correct");document.getElementById("feedback").textContent="✓ Correct! أحسنتِ"}else{button.classList.add("wrong");document.querySelectorAll(".option").forEach(b=>{if(b.textContent===correct)b.classList.add("correct")});document.getElementById("feedback").textContent="✗ Not quite. The correct answer is shown in green."}document.getElementById("scoreText").textContent=`Score: ${score}`;document.getElementById("next").disabled=false}document.getElementById("next").onclick=()=>{if(!answered)return;index++;if(index<TOTAL)render();else finish()};function finish(){document.getElementById("quizCard").style.display="none";document.getElementById("resultCard").style.display="block";document.getElementById("finalScore").textContent=`${score} / ${TOTAL}`;document.getElementById("resultMessage").textContent=score===TOTAL?"Excellent! You mastered Level 2.":score>=7?"Very good! Review the vocabulary you missed and try again.":"Keep practising! Review Lesson 3 vocabulary and try again."}startQuiz();
</script></body></html>
